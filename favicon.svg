<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0c1929" />
      <stop offset="100%" stop-color="#06070a" />
    </radialGradient>

    <!-- Neon Orbital Gradients -->
    <linearGradient id="orbitCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>

    <linearGradient id="orbitEmerald" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Subtle Drop Shadow Filter -->
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded App Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGlow)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Quantum Lattice Coordinate Grid Lines -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#0ea5e9" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.35" />
  <circle cx="32" cy="32" r="17" fill="none" stroke="#22d3ee" stroke-width="0.75" opacity="0.25" />

  <!-- Abstract Intersecting Superposition Orbital Ellipses -->
  <!-- Orbital 1 (35 deg tilt) -->
  <ellipse cx="32" cy="32" rx="22" ry="7.5" fill="none" stroke="url(#orbitCyan)" stroke-width="2.2" transform="rotate(35 32 32)" filter="url(#neonBlur)" opacity="0.95" />

  <!-- Orbital 2 (-35 deg tilt) -->
  <ellipse cx="32" cy="32" rx="22" ry="7.5" fill="none" stroke="url(#orbitEmerald)" stroke-width="2.2" transform="rotate(-35 32 32)" filter="url(#neonBlur)" opacity="0.95" />

  <!-- Kinetic Vector Arc (representing Badminton smash trajectory & quantum phase gate) -->
  <path d="M 14 42 Q 32 10 50 22" fill="none" stroke="#67e8f9" stroke-width="1.8" stroke-linecap="round" opacity="0.75" />

  <!-- Peripheral Orbital Quantum Nodes -->
  <circle cx="47" cy="23" r="2.2" fill="#38bdf8" />
  <circle cx="17" cy="41" r="2.2" fill="#34d399" />
  <circle cx="45" cy="43" r="1.6" fill="#06b6d4" opacity="0.8" />
  <circle cx="19" cy="21" r="1.6" fill="#a5f3fc" opacity="0.8" />

  <!-- High-Energy Dirac Quantum Core Nucleus -->
  <circle cx="32" cy="32" r="5.5" fill="url(#coreGlow)" filter="url(#neonBlur)" />
  <circle cx="32" cy="32" r="2.5" fill="#ffffff" />
</svg>
